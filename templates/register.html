<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - 🌾 AgriConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>

    <!-- Background Animation -->

    <div class="background">

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

        <div class="circle circle-three"></div>

    </div>


    <!-- Register Page -->

    <div class="auth-page">

        <div class="auth-card register-card">

            <!-- Logo -->

            <div class="logo">
                🌾
            </div>


            <h1>Create Account</h1>

            <p class="subtitle">
                Join our agriculture marketplace
            </p>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="flash">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Register Form -->

            <form method="POST"
                  action="{{ url_for('register') }}">


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                    </div>

                </div>


                <!-- Role -->

                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🌱
                        </span>

                        <select name="role"
                                id="role"
                                required>

                            <option value="">
                                Select Account Type
                            </option>

                            <option value="farmer">
                                Farmer
                            </option>

                            <option value="customer">
                                Customer
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Register Button -->

                <button type="submit"
                        class="auth-btn">

                    <span>Create Account</span>

                    <span class="arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- Login Link -->

            <div class="auth-link">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </div>


            <!-- Bottom Text -->

            <div class="bottom-text">
                🌱 Grow • Sell • Succeed
            </div>

        </div>

    </div>


</body>

</html>
