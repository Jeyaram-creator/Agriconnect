<!DOCTYPE html>
<html>

<head>

    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/customer.css') }}">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

 <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

        <div class="logo-section">
            <div class="logo-icon">🌾</div>

            <div>
                <h2>AgriConnect</h2>
                <span>Freshest • Better Tomorrow</span>
            </div>
        </div>


        <!-- Navigation -->
        <nav class="sidebar-menu">

            <a href="{{ url_for('customer_dashboard') }}">
                <span class="menu-icon">🏠</span>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('customer_products') }}">
                <span class="menu-icon">🌱</span>
                <span>Products</span>
            </a>

            <a href="{{ url_for('customer_cart') }}">
                <span class="menu-icon">🛒</span>
                <span>My Cart</span>
            </a>

            <a href="{{ url_for('customer_orders') }}" >
                <span class="menu-icon">📦</span>
                <span>My Orders</span>
            </a>

            <a href="{{ url_for('customer_profile') }}" class="active">
                <span class="menu-icon">👤</span>
                <span>My Profile</span>
            </a>

            <a href="{{ url_for('logout') }}">
                <span class="menu-icon">🚪</span>
                <span>Logout</span>
            </a>

        </nav>


        <!-- Decorative leaves -->
        <div class="sidebar-decoration">
            🌿
        </div>

    </aside>

<div class="main-content">

    <div class="topbar">

        <h2>My Profile</h2>

    </div>


    <div class="card">

        <form method="POST">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    value="{{ profile[0] }}"
                    disabled>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    value="{{ profile[1] }}"
                    disabled>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ profile[2] or '' }}">

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    rows="5">{{ profile[3] or '' }}</textarea>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Update Profile

            </button>

        </form>

    </div>

</div>

</body>

</html>
