<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/customer.css') }}">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

 <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

        <div class="logo-section">
            <div class="logo-icon">🌾</div>

            <div>
                <h2>AgriConnect</h2>
                <span>Freshest • Better Tomorrow</span>
            </div>
        </div>


        <!-- Navigation -->
        <nav class="sidebar-menu">

            <a href="{{ url_for('customer_dashboard') }}">
                <span class="menu-icon">🏠</span>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('customer_products') }}">
                <span class="menu-icon">🌱</span>
                <span>Products</span>
            </a>

            <a href="{{ url_for('customer_cart') }}">
                <span class="menu-icon">🛒</span>
                <span>My Cart</span>
            </a>

            <a href="{{ url_for('customer_orders') }}" class="active">
                <span class="menu-icon">📦</span>
                <span>My Orders</span>
            </a>

            <a href="{{ url_for('customer_profile') }}">
                <span class="menu-icon">👤</span>
                <span>My Profile</span>
            </a>

            <a href="{{ url_for('logout') }}">
                <span class="menu-icon">🚪</span>
                <span>Logout</span>
            </a>

        </nav>


        <!-- Decorative leaves -->
        <div class="sidebar-decoration">
            🌿
        </div>

    </aside>


<div class="main-content">

    <div class="topbar">

        <h2>Checkout</h2>

    </div>


    <div class="checkout-grid">


        <!-- CUSTOMER INFORMATION -->

        <div class="card">

            <h3>Delivery Information</h3>

            <br>

            <form method="POST">

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="fullname"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <textarea
                        name="address"
                        rows="5"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select name="payment_method">

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="Online Payment">
                            Online Payment
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Place Order

                </button>

            </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="card">

            <h3>Order Summary</h3>

            <br>

            {% for item in cart_items %}

            <p>
                {{ item.product_name }}
                × {{ item.quantity }}

                <strong>
                    ₹{{ item.subtotal }}
                </strong>
            </p>

            <hr>

            {% endfor %}

            <br>

            <h2>
                Total: ₹{{ total }}
            </h2>

        </div>

    </div>

</div>

</body>

</html>
