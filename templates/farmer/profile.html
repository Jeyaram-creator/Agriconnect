<!DOCTYPE html>
<html>

<head>

    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/farmer.css') }}">

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <div class="logo">🌾 AgriConnect</div>

    <ul>

        <li>
            <a href="{{ url_for('farmer_dashboard') }}">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="{{ url_for('farmer_profile') }}"
               class="active">
                👤 My Profile
            </a>
        </li>

        <li>
            <a href="{{ url_for('farmer_products') }}">
                🌱 My Products
            </a>
        </li>

        <li>
            <a href="{{ url_for('add_product') }}">
                ➕ Add Product
            </a>
        </li>

        <li>
            <a href="{{ url_for('farmer_orders') }}">
                🛒 Orders
            </a>
        </li>
        <li>
                <a href="{{ url_for('find_farmers') }}">
                    🤝 Find Farmers
                </a>
            </li>

            <li>
                <a href="{{ url_for('my_partnerships') }}">
                    🔗 Partnerships
                </a>
            </li>

        <li>
            <a href="{{ url_for('logout') }}">
                🚪 Logout
            </a>
        </li>

    </ul>

</div>


<div class="main-content">

    <div class="topbar">

        <h2>My Farmer Profile</h2>

    </div>


    <div class="card">

        <form method="POST">

            <div class="profile-grid">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        value="{{ profile[0] }}"
                        disabled>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        value="{{ profile[1] }}"
                        disabled>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ profile[2] }}"
                        placeholder="Phone Number">

                </div>


                <div class="form-group">

                    <label>Farm Name</label>

                    <input
                        type="text"
                        name="farm_name"
                        value="{{ profile[3] }}"
                        placeholder="Farm Name">

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        value="{{ profile[4] }}"
                        placeholder="Farm Location">

                </div>


                <div class="form-group">

                    <label>Farm Size</label>

                    <input
                        type="number"
                        step="0.01"
                        name="farm_size"
                        value="{{ profile[5] }}"
                        placeholder="Size in acres">

                </div>

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    rows="4"
                    placeholder="Farm Address">{{ profile[6] }}</textarea>

            </div>


            <button
                type="submit"
                class="form-btn">

                Update Profile

            </button>

        </form>

    </div>

</div>

</body>

</html>
